[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
# Verifier.sol is generated by the Noir toolchain and contains inline assembly that is
# not annotated as memory-safe, which prevents the IR pipeline from spilling stack
# variables to memory. It cannot be compiled with via_ir = true.
# Tests use MockVerifier; deploy the real HonkVerifier separately with:
#   forge build --skip src/Verifier.sol  (skipped here) and compile it standalone.
skip = ["src/Verifier.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.deploy]
optimizer = false
via_ir = false
skip = []
